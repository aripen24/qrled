<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ส่งรูปภาพขึ้นจอ LED</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1e293b; width: 100%; max-width: 420px; padding: 24px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4); text-align: center; }
    h2 { margin-bottom: 8px; font-size: 1.5rem; color: #38bdf8; }
    p.desc { font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px; }
    .upload-area { border: 2px dashed #38bdf8; border-radius: 16px; padding: 30px 15px; cursor: pointer; transition: 0.3s; background: rgba(56, 189, 248, 0.03); }
    .upload-area:hover { background: rgba(56, 189, 248, 0.1); }
    .icon { font-size: 48px; margin-bottom: 10px; }
    input[type="file"] { display: none; }
    #preview { max-width: 100%; max-height: 250px; border-radius: 12px; margin-top: 15px; display: none; object-fit: cover; }
    .btn { width: 100%; margin-top: 20px; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 0.95rem; font-weight: 500; min-height: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📸 อัปโหลดภาพขึ้นจอ</h2>
    <p class="desc">เลือกรูปถ่ายเพื่อนำไปแสดงบนจอ LED ในงาน</p>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <div id="upload-placeholder">
        <div class="icon">📷</div>
        <p style="color: #e2e8f0; font-weight: 500;">แตะตรงนี้เพื่อเลือกรูปภาพ หรือถ่ายรูป</p>
      </div>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect()">
      <img id="preview" alt="Preview">
    </div>

    <button id="uploadBtn" class="btn" onclick="upload()" disabled>ส่งภาพขึ้นจอทันที</button>
    <div id="status"></div>
  </div>

  <script>
    function handleFileSelect() {
      const file = document.getElementById('fileInput').files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('preview').src = e.target.result;
          document.getElementById('preview').style.display = 'block';
          document.getElementById('upload-placeholder').style.display = 'none';
          document.getElementById('uploadBtn').disabled = false;
        };
        reader.readAsDataURL(file);
      }
    }

    function upload() {
      const file = document.getElementById('fileInput').files[0];
      const btn = document.getElementById('uploadBtn');
      const status = document.getElementById('status');

      if (!file) return;

      btn.disabled = true;
      status.innerText = "⏳ กำลังส่งรูปภาพ...";
      status.style.color = "#38bdf8";

      const reader = new FileReader();
      reader.onload = () => {
        google.script.run.withSuccessHandler(res => {
          if (res.success) {
            status.innerText = "🎉 ส่งภาพขึ้นจอเรียบร้อยแล้ว!";
            status.style.color = "#4ade80";
            document.getElementById('fileInput').value = '';
            document.getElementById('preview').style.display = 'none';
            document.getElementById('upload-placeholder').style.display = 'block';
          } else {
            status.innerText = "❌ " + res.message;
            status.style.color = "#f87171";
            btn.disabled = false;
          }
        }).uploadImage(reader.result, file.name);
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
